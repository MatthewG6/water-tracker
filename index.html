<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b5fff" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Water" />

    <title>Water Tracker</title>

    <style>
      :root {
        --bg1: #0b1220;
        --bg2: #07111f;
        --card: rgba(255, 255, 255, 0.08);
        --card2: rgba(255, 255, 255, 0.06);
        --stroke: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --muted2: rgba(255, 255, 255, 0.45);

        --blue1: #4cc9f0;
        --blue2: #4895ef;
        --good: #3ddc97;
        --bad: #ff5a5f;

        --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Display",
          "SF Pro Text",
          system-ui,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background:
          radial-gradient(
            1200px 700px at 20% 10%,
            rgba(76, 201, 240, 0.2),
            transparent 60%
          ),
          radial-gradient(
            900px 600px at 80% 0%,
            rgba(72, 149, 239, 0.18),
            transparent 55%
          ),
          radial-gradient(
            1000px 900px at 50% 110%,
            rgba(61, 220, 151, 0.1),
            transparent 60%
          ),
          linear-gradient(180deg, var(--bg1), var(--bg2));
        display: grid;
        place-items: center;
        padding: 22px;
      }

      .app {
        width: min(420px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 6px 2px;
      }

      .title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
      }

      .card {
        background: linear-gradient(
          180deg,
          var(--card),
          var(--card2)
        );
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .bigRow {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }

      .bigNumber {
        font-size: 54px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .unit {
        font-size: 16px;
        font-weight: 700;
        color: var(--muted);
        margin-left: 6px;
      }

      .goalPill {
        font-size: 13px;
        color: var(--muted);
        border: 1px solid var(--stroke);
        padding: 10px 12px;
        border-radius: 999px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(
          180deg,
          var(--blue1),
          var(--blue2)
        );
        box-shadow: 0 0 18px rgba(76, 201, 240, 0.45);
      }

      .progressWrap {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }

      .progressTop {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }

      .bar {
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(
          90deg,
          var(--blue1),
          var(--blue2)
        );
        box-shadow: 0 0 22px rgba(72, 149, 239, 0.45);
        transition: width 220ms ease;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
      }

      button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 12px 12px;
        border-radius: 16px;
        font-weight: 750;
        font-size: 14px;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      button:active {
        transform: scale(0.98);
      }

      .primary {
        background: linear-gradient(
          180deg,
          rgba(76, 201, 240, 0.95),
          rgba(72, 149, 239, 0.95)
        );
        border: none;
        color: #061021;
      }

      .ghost {
        background: rgba(255, 255, 255, 0.07);
      }

      .danger {
        background: rgba(255, 90, 95, 0.16);
        border: 1px solid rgba(255, 90, 95, 0.35);
      }

      .footerRow {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .status {
        color: var(--muted2);
        font-size: 12px;
      }

      .tinyBtn {
        padding: 10px 12px;
        border-radius: 14px;
        font-weight: 750;
        font-size: 13px;
      }

      .chartTabs {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .tabBtn {
        padding: 10px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2px;
        background: rgba(255, 255, 255, 0.07);
      }

      .tabBtn.active {
        background: linear-gradient(
          180deg,
          rgba(76, 201, 240, 0.95),
          rgba(72, 149, 239, 0.95)
        );
        color: #061021;
        border-color: transparent;
      }

      /* Swipe container */
      .pager {
        width: 100%;
        max-width: 520px;
        height: 100%;
        display: flex;

        overflow-x: auto; /* <- DO NOT REMOVE */
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;

        /* hide scrollbar (optional) */
        scrollbar-width: none; /* Firefox */
      }

      .pager::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
      }

      .page {
        flex: 0 0 100%;
        scroll-snap-align: start;

        display: flex; /* center the app inside the page */
        justify-content: center;
        align-items: flex-start;

        /* gutter so pages/cards don't “kiss” at the swipe seam */
        padding: 0 16px;
      }

      @media (max-width: 520px) {
        .page {
          padding: 0 24px;
        }
      }

      /* Keep your existing center layout, but don't fight pager */
      body {
        place-items: center;
      }

      .dots {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .dotBtn {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.14);
        padding: 0;
      }

      @media (max-width: 520px) {
        .card {
          box-shadow: 0 12px 26px rgba(0, 0, 0, 0.16);
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pager" id="pager">
      <!-- PAGE 1: Tracker -->
      <section class="page">
        <div class="app">
          <div class="header">
            <div>
              <div class="title">Gallon Water Tracker</div>
              <div class="subtitle">
                Resets daily at 5:00 AM Central
              </div>
            </div>
            <div class="goalPill">
              <span class="dot"></span>
              <span
                >Goal: <strong id="goalText1">128</strong> oz</span
              >
            </div>
          </div>

          <div class="card">
            <div class="bigRow">
              <div>
                <span class="bigNumber" id="bigNumber">0</span>
                <span class="unit">oz</span>
              </div>
              <div class="goalPill" id="percentPill">0%</div>
            </div>

            <div class="progressWrap">
              <div class="progressTop">
                <span id="progressText">0 / 128</span>
                <span id="remainingText">128 oz left</span>
              </div>
              <div class="bar">
                <div class="fill" id="fill"></div>
              </div>
            </div>

            <div class="grid">
              <button class="primary" onclick="addWater(8)">
                +8
              </button>
              <button class="primary" onclick="addWater(16)">
                +16
              </button>
              <button class="primary" onclick="addWater(25)">
                +25
              </button>

              <button class="ghost" onclick="addWater(32)">
                +32
              </button>
              <button class="ghost" onclick="undoLast()">Undo</button>
              <button class="danger" onclick="reset()">Reset</button>
            </div>

            <div class="footerRow">
              <div class="status" id="status">Saved on device</div>
              <div style="display: flex; gap: 10px">
                <button
                  class="tinyBtn ghost"
                  onclick="setGoalPrompt()"
                >
                  Change goal
                </button>
                <button class="tinyBtn ghost" onclick="goToPage(1)">
                  Weekly
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- PAGE 2: Weekly -->
      <section class="page">
        <div class="app">
          <div class="header">
            <div>
              <div class="title">Insights</div>
              <div class="subtitle">
                Day, week, month, year • resets at 5:00 AM
              </div>
            </div>
            <button class="tinyBtn ghost" onclick="goToPage(0)">
              Back
            </button>
          </div>

          <div class="card">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
              "
            >
              <div class="subtitle" id="weekStats">—</div>
              <div class="goalPill">
                <span class="dot"></span>Goal:
                <strong id="goalText2">128</strong> oz
              </div>
            </div>

            <div class="chartTabs">
              <button
                class="tabBtn active"
                id="tab-day"
                onclick="setChartRange('day')"
              >
                Day
              </button>
              <button
                class="tabBtn"
                id="tab-week"
                onclick="setChartRange('week')"
              >
                Week
              </button>
              <button
                class="tabBtn"
                id="tab-month"
                onclick="setChartRange('month')"
              >
                Month
              </button>
              <button
                class="tabBtn"
                id="tab-year"
                onclick="setChartRange('year')"
              >
                Year
              </button>
            </div>

            <div style="margin-top: 14px">
              <canvas id="insightsChart" height="180"></canvas>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- dots -->
    <div class="dots">
      <button
        class="dotBtn"
        onclick="goToPage(0)"
        aria-label="Tracker"
      ></button>
      <button
        class="dotBtn"
        onclick="goToPage(1)"
        aria-label="Weekly"
      ></button>
    </div>

    <!-- Chart.js FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Your data layer -->
    <script src="data.js"></script>

    <script>
      let oz = 0;
      let goalOz = 128;
      let insightsChart = null;
      let chartRange = "day";

      function saveState() {
        try {
          localStorage.setItem("water_goal", String(goalOz));
        } catch (e) {}
      }

      function loadState() {
        const today = WT.getTodayTotal();
        oz = today.totalOz;

        const g = localStorage.getItem("water_goal");
        goalOz = g ? Math.max(1, parseInt(g, 10) || 128) : 128;
      }

      function goToPage(i) {
        const pager = document.getElementById("pager");
        if (!pager) return;
        pager.scrollTo({
          left: pager.clientWidth * i,
          behavior: "smooth",
        });
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function getChartTheme() {
        const css = getComputedStyle(document.documentElement);
        return {
          text:
            css.getPropertyValue("--muted").trim() ||
            "rgba(255,255,255,.65)",
          grid: "rgba(255,255,255,0.10)",
          blue1: css.getPropertyValue("--blue1").trim() || "#4cc9f0",
          blue2: css.getPropertyValue("--blue2").trim() || "#4895ef",
        };
      }

      function dayKeyToDate(dayKey) {
        const [y, m, d] = dayKey.split("-").map(Number);
        return new Date(y, m - 1, d, 12, 0, 0, 0);
      }

      function makeDayKey(y, m, d) {
        const mm = String(m).padStart(2, "0");
        const dd = String(d).padStart(2, "0");
        return `${y}-${mm}-${dd}`;
      }

      function formatTime(ts) {
        return new Intl.DateTimeFormat("en-US", {
          hour: "numeric",
          minute: "2-digit",
        }).format(new Date(ts));
      }

      function getDayChartData(state, dayKey) {
        const entries = state.entries[dayKey] || [];
        if (!entries.length) {
          return {
            labels: ["No entries"],
            datasets: [
              {
                label: "Added (oz)",
                data: [0],
                borderRadius: 8,
              },
            ],
            stats: "Today: no entries yet",
            optionsPatch: {
              scales: {
                y: { beginAtZero: true, suggestedMax: goalOz },
              },
            },
          };
        }

        return {
          labels: entries.map((e) => formatTime(e.ts)),
          datasets: [
            {
              label: "Added (oz)",
              data: entries.map((e) => e.oz),
              borderRadius: 8,
            },
          ],
          stats: `Today: ${entries.length} entries • ${Math.round(oz)} oz total`,
          optionsPatch: {
            scales: {
              y: { beginAtZero: true },
            },
          },
        };
      }

      function getWeekChartData(state, dayKey) {
        const current = dayKeyToDate(dayKey);
        const sunday = new Date(current);
        sunday.setDate(current.getDate() - current.getDay());

        const labels = [
          "Sun",
          "Mon",
          "Tue",
          "Wed",
          "Thu",
          "Fri",
          "Sat",
        ];
        const values = [];

        for (let i = 0; i < 7; i++) {
          const dt = new Date(sunday);
          dt.setDate(sunday.getDate() + i);
          const key = makeDayKey(
            dt.getFullYear(),
            dt.getMonth() + 1,
            dt.getDate(),
          );
          values.push(state.dailyTotals[key] || 0);
        }

        const total = values.reduce((a, b) => a + b, 0);
        const avg = Math.round((total / 7) * 10) / 10;

        return {
          labels,
          datasets: [
            {
              label: "Water (oz)",
              data: values,
              borderRadius: 10,
              borderSkipped: false,
            },
          ],
          stats: `Week total: ${Math.round(total)} oz • Avg: ${avg} oz/day`,
          optionsPatch: {
            scales: {
              y: { beginAtZero: true },
            },
          },
        };
      }

      function getMonthChartData(state, dayKey) {
        const current = dayKeyToDate(dayKey);
        const year = current.getFullYear();
        const month = current.getMonth() + 1;
        const daysInMonth = new Date(year, month, 0).getDate();
        const starts = [1, 8, 15, 22, 29].filter(
          (d) => d <= daysInMonth,
        );

        const labels = starts.map((d) => String(d));
        const values = starts.map((start) => {
          const end = Math.min(start + 6, daysInMonth);
          let sum = 0;
          let count = 0;
          for (let d = start; d <= end; d++) {
            sum += state.dailyTotals[makeDayKey(year, month, d)] || 0;
            count++;
          }
          return Math.round((sum / count) * 10) / 10;
        });

        const avg =
          values.length > 0
            ? Math.round(
                (values.reduce((a, b) => a + b, 0) / values.length) *
                  10,
              ) / 10
            : 0;

        return {
          labels,
          datasets: [
            {
              label: "Avg oz/day",
              data: values,
              borderRadius: 10,
              borderSkipped: false,
            },
          ],
          stats: `Month checkpoints avg: ${avg} oz/day`,
          optionsPatch: {
            scales: {
              y: { beginAtZero: true },
            },
          },
        };
      }

      function getYearChartData(state, dayKey) {
        const current = dayKeyToDate(dayKey);
        const year = current.getFullYear();
        const currentMonth = current.getMonth() + 1;
        const currentDay = current.getDate();
        const labels = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];

        const values = labels.map((_, idx) => {
          const month = idx + 1;
          let days = new Date(year, month, 0).getDate();
          if (month > currentMonth) return 0;
          if (month === currentMonth) days = currentDay;
          let sum = 0;
          for (let d = 1; d <= days; d++) {
            sum += state.dailyTotals[makeDayKey(year, month, d)] || 0;
          }
          return Math.round((sum / days) * 10) / 10;
        });

        const ytdAvg =
          currentMonth > 0
            ? Math.round(
                (values
                  .slice(0, currentMonth)
                  .reduce((a, b) => a + b, 0) /
                  currentMonth) *
                  10,
              ) / 10
            : 0;

        return {
          labels,
          datasets: [
            {
              label: "Avg oz/day",
              data: values,
              borderRadius: 10,
              borderSkipped: false,
            },
          ],
          stats: `Year-to-date monthly avg: ${ytdAvg} oz/day`,
          optionsPatch: {
            scales: {
              y: { beginAtZero: true },
            },
          },
        };
      }

      function getRangeData(range) {
        const state = WT.loadState();
        const dayKey = WT.getTodayTotal().dayKey;
        if (range === "week") return getWeekChartData(state, dayKey);
        if (range === "month")
          return getMonthChartData(state, dayKey);
        if (range === "year") return getYearChartData(state, dayKey);
        return getDayChartData(state, dayKey);
      }

      function setTabActive(range) {
        ["day", "week", "month", "year"].forEach((id) => {
          const el = document.getElementById(`tab-${id}`);
          if (!el) return;
          el.classList.toggle("active", id === range);
        });
      }

      function buildInsightsChart() {
        const canvas = document.getElementById("insightsChart");
        if (!canvas) return;
        const theme = getChartTheme();
        const rangeData = getRangeData(chartRange);

        const chartData = {
          labels: rangeData.labels,
          datasets: rangeData.datasets.map((dataset) => ({
            ...dataset,
            backgroundColor:
              dataset.backgroundColor ||
              ((ctx) => {
                const chart = ctx.chart;
                const area = chart.chartArea;
                if (!area) return theme.blue2;
                const g = chart.ctx.createLinearGradient(
                  0,
                  area.bottom,
                  0,
                  area.top,
                );
                g.addColorStop(0, theme.blue2);
                g.addColorStop(1, theme.blue1);
                return g;
              }),
            borderColor: dataset.borderColor || "transparent",
          })),
        };

        const baseOptions = {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 320, easing: "easeOutCubic" },
          indexAxis: "x",
          plugins: {
            legend: { display: false },
            tooltip: {
              displayColors: false,
              callbacks: {
                label: (c) => {
                  const value =
                    typeof c.parsed.y === "number"
                      ? c.parsed.y
                      : c.parsed.x;
                  return `${value} oz`;
                },
              },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: theme.text, font: { weight: 700 } },
            },
            y: {
              beginAtZero: true,
              grid: { color: theme.grid },
              ticks: { color: theme.text },
            },
          },
          ...rangeData.optionsPatch,
        };

        if (!insightsChart) {
          insightsChart = new Chart(canvas, {
            type: "bar",
            data: chartData,
            options: baseOptions,
          });
          updateWeeklyHeader();
          return;
        }

        insightsChart.data.labels = chartData.labels;
        insightsChart.data.datasets = chartData.datasets;
        insightsChart.options = baseOptions;
        insightsChart.update();
        updateWeeklyHeader();
      }

      function updateWeeklyHeader() {
        const ws = document.getElementById("weekStats");
        if (ws) ws.textContent = getRangeData(chartRange).stats;

        const g2 = document.getElementById("goalText2");
        if (g2) g2.textContent = String(goalOz);
      }

      function setChartRange(range) {
        chartRange = range;
        setTabActive(range);
        buildInsightsChart();
      }

      function updateUI() {
        document.getElementById("goalText1").textContent =
          String(goalOz);

        const pct = clamp((oz / goalOz) * 100, 0, 999);
        document.getElementById("bigNumber").textContent = oz;
        document.getElementById("progressText").textContent =
          `${oz} / ${goalOz}`;
        document.getElementById("percentPill").textContent =
          `${Math.floor(pct)}%`;

        const remaining = Math.max(0, goalOz - oz);
        document.getElementById("remainingText").textContent =
          remaining === 0 ? "Goal hit 🎉" : `${remaining} oz left`;

        document.getElementById("fill").style.width =
          `${clamp((oz / goalOz) * 100, 0, 100)}%`;
        document.getElementById("status").textContent =
          "Saved on device • resets at 5:00 AM";

        saveState();
        buildInsightsChart();
      }

      function addWater(amount) {
        const result = WT.addWater(amount);
        oz = result.totalOz;
        updateUI();
      }

      function undoLast() {
        const result = WT.undoLastEntry();
        oz = result.totalOz;
        updateUI();
      }

      function reset() {
        const result = WT.resetToday();
        oz = result.totalOz;
        updateUI();
      }

      function setGoalPrompt() {
        const input = prompt("Set daily goal (oz):", String(goalOz));
        if (!input) return;
        const val = parseInt(input, 10);
        if (!Number.isFinite(val) || val <= 0) return;
        goalOz = val;
        updateUI();
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadState();
        updateUI();
        setChartRange("day");
      });
    </script>
  </body>
</html>
